name: Update dashboard

on:
  schedule:
    - cron: "45 11 * * 1-5"   # 5:15 PM IST, Mon-Fri, after market close
    - cron: "30 3 * * 6"      # 9:00 AM IST Saturday: weekly fundamentals refresh
  workflow_dispatch:
    inputs:
      fundamentals:
        description: "Refresh fundamentals too (slow, ~1 hour first time)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps the universe, sector map and fundamentals between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Run pipeline
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * 6" ] || [ "${{ inputs.fundamentals }}" = "true" ]; then
            python run.py --fundamentals
          else
            python run.py
          fi

      - name: Publish page
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/index.html docs/zones.html
          git diff --cached --quiet && exit 0
          git commit -m "Update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed, retrying in 10s ($i/3)"; sleep 10
          done
          exit 1
