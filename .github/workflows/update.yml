name: Update dashboard

on:
  schedule:
    - cron: "45 11 * * 1-5"   # 5:15 PM IST, Mon-Fri, after market close
    - cron: "30 3 * * 6"      # 9:00 AM IST Saturday: weekly fundamentals refresh
  workflow_dispatch:
    inputs:
      fundamentals:
        description: "Refresh fundamentals too (slow, ~1 hour first time)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps the universe, sector map and fundamentals between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Run pipeline
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * 6" ] || [ "${{ inputs.fundamentals }}" = "true" ]; then
            python run.py --fundamentals
          else
            python run.py
          fi

      # Publish to a separate "gh-pages" branch as one fresh commit each time,
      # so the repository doesn't grow by megabytes every day and your own
      # edits on main can never clash with the bot.
      - name: Publish page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="dashboard-bot" -c user.email="dashboard-bot@users.noreply.github.com" commit -q -m "Dashboard $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
