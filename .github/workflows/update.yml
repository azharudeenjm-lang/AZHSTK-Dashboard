name: Update dashboard

on:
  schedule:
    - cron: "45 11 * * 1-5"   # 5:15 PM IST, Mon-Fri, after market close (full refresh)
    - cron: "15,45 4-9 * * 1-5"   # every 30 min, 9:45 AM - 3:15 PM IST: quick intraday refresh
    - cron: "30 3 * * 6"      # 9:00 AM IST Saturday: weekly fundamentals refresh
  workflow_dispatch:
    inputs:
      intraday:
        description: "Quick intraday refresh (today's prices only)"
        type: boolean
        default: false
      fundamentals:
        description: "Refresh fundamentals too (slow, ~1 hour first time)"
        type: boolean
        default: false
      backtest:
        description: "Rerun the weekly zone backtest (adds ~15-25 min)"
        type: boolean
        default: false
      buy_backtest:
        description: "Buy criteria backtest from 2020 (adds ~20-30 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '15,45 4-9 * * 1-5' && 25 || 300 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps the universe, sector map and fundamentals between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Run pipeline
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "30 3 * * 6" ]; then ARGS="--fundamentals --backtest"; fi
          if [ "${{ inputs.fundamentals }}" = "true" ]; then ARGS="$ARGS --fundamentals"; fi
          if [ "${{ inputs.backtest }}" = "true" ]; then ARGS="$ARGS --backtest"; fi
          if [ "${{ inputs.buy_backtest }}" = "true" ]; then ARGS="$ARGS --buy-backtest"; fi
          if [ "${{ github.event.schedule }}" = "15,45 4-9 * * 1-5" ] || [ "${{ inputs.intraday }}" = "true" ]; then ARGS="--intraday"; fi
          python -u run.py $ARGS

      # Publish to a separate "gh-pages" branch as one fresh commit each time,
      # so the repository doesn't grow by megabytes every day and your own
      # edits on main can never clash with the bot.
      - name: Publish page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="dashboard-bot" -c user.email="dashboard-bot@users.noreply.github.com" commit -q -m "Dashboard $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
